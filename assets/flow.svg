<text x="72" y="249.5" font-family="&quot;Noto Sans KR&quot;, -apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, &quot;Segoe UI&quot;, sans-serif" font-size="24" font-weight="600" fill="#101828">받은 연락을 붙여넣어요</text>
