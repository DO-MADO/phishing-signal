<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">피싱 신호등 — 내 연락에서 다음 행동까지</title>
  <desc id="desc">내 브라우저에서 AI가 문맥을 분류합니다. Dangerous와 Hold는 유지하고 Safe만 엄격한 규칙으로 확인합니다. 근거가 있으면 Hold로 보정합니다. 근거가 없고 피해 상황을 선택하지 않았다면 실제 행동 요청을 묻습니다. 있음, 모름, 미응답은 행동 보류와 공식 경로 확인을 안내하고 없음은 위험 신호 미확인으로 표시합니다. 답변은 모델 라벨을 바꾸지 않습니다. 이미 행동했다면 모델 로딩이나 분석 실패와 관계없이 긴급 대응을 이용하며 Safe 질문은 생략합니다.</desc>
  <defs>
    <g id="chip">
      <path d="M20 4v12M40 4v12M60 4v12M20 64v12M40 64v12M60 64v12M4 20h12M4 40h12M4 60h12M64 20h12M64 40h12M64 60h12" stroke="#84ADFF" stroke-width="7" stroke-linecap="round"/>
      <rect x="12" y="12" width="56" height="56" rx="13" fill="#175CD3"/>
      <rect x="12" y="8" width="56" height="56" rx="13" fill="#528BFF"/>
      <rect x="27" y="23" width="26" height="26" rx="8" fill="#D1E0FF"/>
    </g>
    <g id="browser">
      <rect x="4" y="11" width="56" height="45" rx="9" fill="#1D2939"/>
      <rect x="4" y="7" width="56" height="45" rx="9" fill="#344054"/>
      <rect x="9" y="20" width="46" height="27" rx="4" fill="#F2F4F7"/>
      <circle cx="12" cy="14" r="2" fill="#F2F4F7"/>
      <circle cx="19" cy="14" r="2" fill="#F2F4F7"/>
      <path d="M25 24h10l8 8v10a3 3 0 0 1-3 3H25a3 3 0 0 1-3-3V27a3 3 0 0 1 3-3Z" fill="#84ADFF"/>
      <path d="M35 24v5a3 3 0 0 0 3 3h5Z" fill="#528BFF"/>
      <rect x="27" y="36" width="11" height="3" rx="1.5" fill="#F2F4F7"/>
    </g>
    <g id="message">
      <path d="M14 13h36a10 10 0 0 1 10 10v21a10 10 0 0 1-10 10H27l-12 7V54h-1A10 10 0 0 1 4 44V23a10 10 0 0 1 10-10Z" fill="#F79009"/>
      <path d="M14 9h36a10 10 0 0 1 10 10v21a10 10 0 0 1-10 10H27l-12 7V50h-1A10 10 0 0 1 4 40V19A10 10 0 0 1 14 9Z" fill="#FEC84B"/>
      <rect x="15" y="23" width="34" height="5" rx="2.5" fill="#FFF7DB"/>
      <rect x="15" y="34" width="23" height="5" rx="2.5" fill="#FFF7DB"/>
    </g>
    <g id="phone">
      <path d="m12 10 7-2a4 4 0 0 1 5 2l6 11a4 4 0 0 1-1 5l-5 4a38 38 0 0 0 12 12l4-5a4 4 0 0 1 5-1l11 6a4 4 0 0 1 2 5l-2 7a8 8 0 0 1-9 6C26 57 7 38 6 19a8 8 0 0 1 6-9Z" fill="#D92D20"/>
      <path d="m12 6 7-2a4 4 0 0 1 5 2l6 11a4 4 0 0 1-1 5l-5 4a38 38 0 0 0 12 12l4-5a4 4 0 0 1 5-1l11 6a4 4 0 0 1 2 5l-2 7a8 8 0 0 1-9 6C26 53 7 34 6 15a8 8 0 0 1 6-9Z" fill="#F97066"/>
    </g>
  </defs>
  <style>text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }</style>
  <rect width="1600" height="900" rx="32" fill="#101828"/>
  <g fill="#F5F7FB">
    <text x="64" y="61" font-size="24" font-weight="600" fill="#98A9C1">판단과 행동의 흐름</text>
    <text x="1536" y="61" text-anchor="end" font-size="20" fill="#98A9C1">피싱 신호등 · 설명용 도식</text>
    <text x="64" y="137" font-size="56" font-weight="800" letter-spacing="-2">내 연락에서, 다음 행동까지.</text>
    <text x="64" y="184" font-size="25" fill="#B2CCFF">AI 판정 · 제한된 규칙 보정 · 사용자 확인</text>

    <rect x="64" y="238" width="432" height="442" rx="28" fill="#19283E"/>
    <g transform="translate(94 263) scale(1.1)"><use href="#chip"/></g>
    <text x="210" y="309" font-size="21" font-weight="600" fill="#B2CCFF">01 / 브라우저 AI</text>
    <text x="96" y="387" font-size="32" font-weight="700" letter-spacing="-1">연락의 문맥을 읽습니다</text>
    <text x="96" y="430" font-size="23" fill="#BDCADD">KLUE RoBERTa · C3 v2</text>
    <path d="M96 460h368" stroke="#344762"/>
    <circle cx="102" cy="502" r="6" fill="#98A9C1"/>
    <text x="124" y="510" font-size="24" font-weight="600">Dangerous · Hold</text>
    <text x="124" y="547" font-size="23" fill="#BDCADD">기본 판정 유지</text>
    <circle cx="102" cy="601" r="6" fill="#84ADFF"/>
    <text x="124" y="609" font-size="26" font-weight="700" fill="#B2CCFF">Safe → 규칙 확인</text>
    <text x="96" y="651" font-size="19" fill="#98A9C1">원문은 외부 AI 서버로 보내지 않습니다.</text>

    <path d="M516 397h48m-12-12 12 12-12 12" fill="none" stroke="#84ADFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="540" y="366" text-anchor="middle" font-size="18" fill="#B2CCFF">Safe</text>

    <rect x="584" y="238" width="432" height="442" rx="28" fill="#19283E"/>
    <g transform="translate(611 258) scale(1.45)"><use href="#browser"/></g>
    <text x="730" y="309" font-size="21" font-weight="600" fill="#B2CCFF">02 / 규칙 확인</text>
    <text x="616" y="387" font-size="32" font-weight="700" letter-spacing="-1">Safe만 다시 살핍니다</text>
    <text x="616" y="430" font-size="23" fill="#BDCADD">명확한 위험 행동 요구를</text>
    <text x="616" y="465" font-size="23" fill="#BDCADD">원문 구절과 함께 확인합니다.</text>
    <text x="616" y="518" font-size="19" fill="#98A9C1">근거 있음</text>
    <text x="616" y="556" font-size="29" font-weight="700" fill="#FEC84B">Hold로 보정</text>
    <text x="616" y="604" font-size="19" fill="#98A9C1">근거 없음</text>
    <text x="616" y="643" font-size="29" font-weight="700" fill="#B2CCFF">행동 확인으로</text>

    <text x="1060" y="563" text-anchor="middle" font-size="17" fill="#B2CCFF">피해 상황</text>
    <text x="1060" y="589" text-anchor="middle" font-size="17" fill="#B2CCFF">미선택 시</text>
    <path d="M1036 622h48m-12-12 12 12-12 12" fill="none" stroke="#84ADFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1104" y="238" width="432" height="442" rx="28" fill="#19283E"/>
    <g transform="translate(1131 261) scale(1.4)"><use href="#message"/></g>
    <text x="1250" y="309" font-size="21" font-weight="600" fill="#B2CCFF">03 / 사용자 확인</text>
    <text x="1136" y="387" font-size="32" font-weight="700" letter-spacing="-1">실제 요청을 묻습니다</text>
    <text x="1136" y="430" font-size="22" fill="#BDCADD">송금 · 정보 전달 · 앱/기기 접근</text>
    <rect x="1136" y="460" width="368" height="92" rx="16" fill="#FEC84B"/>
    <text x="1156" y="493" font-size="19" fill="#654A10">있음 · 모름 · 미응답</text>
    <text x="1156" y="532" font-size="25" font-weight="700" fill="#101828">보류 후 공식 경로 확인</text>
    <rect x="1136" y="568" width="368" height="55" rx="16" fill="#2B3D57"/>
    <text x="1156" y="604" font-size="23" font-weight="600">없음 → 위험 신호 미확인</text>
    <text x="1136" y="655" font-size="18" fill="#98A9C1">응답은 모델 라벨을 바꾸지 않습니다.</text>

    <rect x="64" y="726" width="1472" height="118" rx="28" fill="#FFF4F1"/>
    <g transform="translate(94 750) scale(1.05)"><use href="#phone"/></g>
    <text x="189" y="771" font-size="23" fill="#B42318">이미 송금·정보 전달·앱 설치를 했다면</text>
    <text x="189" y="814" font-size="32" font-weight="700" letter-spacing="-1" fill="#101828">분석을 기다리지 않고 긴급 대응으로.</text>
    <path d="M946 754v64" stroke="#EACEC7"/>
    <text x="979" y="773" font-size="22" fill="#744A43">모델 로딩·분석 실패와 관계없이 이용</text>
    <text x="979" y="813" font-size="22" fill="#744A43">피해 상황을 선택하면 Safe 질문 생략</text>
    <text x="64" y="883" font-size="19" fill="#98A9C1">분석 결과는 참고 정보이며 발신자나 거래의 안전을 인증하지 않습니다.</text>
  </g>
</svg>
