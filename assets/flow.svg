<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">피싱 신호등: AI 판정에서 행동 확인까지</title>
<desc id="desc">Dangerous와 Hold는 유지합니다. Safe만 규칙 근거를 확인하고 근거가 있으면 Hold로 보정합니다. 근거가 없고 피해 상황을 선택하지 않았을 때 사용자에게 행동을 확인합니다. 이미 피해가 있다면 모델을 기다리지 않고 대응하며 Safe 질문은 생략합니다.</desc>
