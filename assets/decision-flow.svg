<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">피싱 신호등 — 내 연락에서 다음 행동까지</title>
  <desc id="desc">설명용 흐름도입니다. 브라우저 AI, Safe에 한정한 규칙 확인, 사용자 행동 확인 순서로 강조합니다. Dangerous와 Hold는 유지합니다. Safe에 규칙 근거가 있으면 Hold로 보정하고 근거가 없고 피해 상황을 선택하지 않았다면 실제 요청을 묻습니다. 있음, 모름, 미응답은 행동 보류와 공식 경로 확인을 안내하고 없음은 위험 신호 미확인으로 표시합니다. 답변은 모델 라벨을 바꾸지 않습니다. 이미 행동했다면 모델 로딩이나 분석 실패와 관계없이 긴급 대응을 이용하며 Safe 질문은 생략합니다.</desc>
  <defs>
    <g id="chip">
      <path d="M20 4v12M40 4v12M60 4v12M20 64v12M40 64v12M60 64v12M4 20h12M4 40h12M4 60h12M64 20h12M64 40h12M64 60h12" stroke="#84ADFF" stroke-width="7" stroke-linecap="round"/>
      <rect x="12" y="12" width="56" height="56" rx="13" fill="#175CD3"/>
      <rect x="12" y="8" width="56" height="56" rx="13" fill="#528BFF"/>
      <rect x="27" y="23" width="26" height="26" rx="8" fill="#D1E0FF"/>
    </g>
    <g id="browser">
      <rect x="4" y="11" width="56" height="45" rx="9" fill="#1D2939"/>
      <rect x="4" y="7" width="56" height="45" rx="9" fill="#344054"/>
      <rect x="9" y="20" width="46" height="27" rx="4" fill="#F2F4F7"/>
      <circle cx="12" cy="14" r="2" fill="#F2F4F7"/>
      <circle cx="19" cy="14" r="2" fill="#F2F4F7"/>
      <path d="M25 24h10l8 8v10a3 3 0 0 1-3 3H25a3 3 0 0 1-3-3V27a3 3 0 0 1 3-3Z" fill="#84ADFF"/>
      <path d="M35 24v5a3 3 0 0 0 3 3h5Z" fill="#528BFF"/>
      <rect x="27" y="36" width="11" height="3" rx="1.5" fill="#F2F4F7"/>
    </g>
    <g id="message">
      <path d="M14 13h36a10 10 0 0 1 10 10v21a10 10 0 0 1-10 10H27l-12 7V54h-1A10 10 0 0 1 4 44V23a10 10 0 0 1 10-10Z" fill="#F79009"/>
      <path d="M14 9h36a10 10 0 0 1 10 10v21a10 10 0 0 1-10 10H27l-12 7V50h-1A10 10 0 0 1 4 40V19A10 10 0 0 1 14 9Z" fill="#FEC84B"/>
      <rect x="15" y="23" width="34" height="5" rx="2.5" fill="#FFF7DB"/>
      <rect x="15" y="34" width="23" height="5" rx="2.5" fill="#FFF7DB"/>
    </g>
    <clipPath id="first-route" clipPathUnits="userSpaceOnUse">
      <rect class="first-window" x="506" y="686" width="70" height="48"/>
    </clipPath>
    <clipPath id="second-route" clipPathUnits="userSpaceOnUse">
      <rect class="second-window" x="1026" y="706" width="70" height="48"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .first-arrow, .second-arrow, .safe-focus, .rule-focus { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .model-icon { animation: model-read 8.4s ease-in-out infinite; }
      .safe-focus { animation: safe-ready 8.4s ease-in-out infinite; }
      .first-window { animation: first-trace 8.4s ease-in-out infinite; }
      .first-arrow { animation: first-connect 8.4s ease-in-out infinite; }
      .rule-icon { animation: rule-read 8.4s ease-in-out infinite; }
      .rule-focus { animation: rule-ready 8.4s ease-in-out infinite; }
      .second-window { animation: second-trace 8.4s ease-in-out infinite; }
      .second-arrow { animation: second-connect 8.4s ease-in-out infinite; }
      .question-icon { animation: question-arrive 8.4s ease-in-out infinite; }
      .action-result { animation: action-arrive 8.4s ease-in-out infinite; }
    }
    @keyframes model-read { 0%, 3%, 22%, 100% { transform: translateY(0); } 8%, 15% { transform: translateY(-7px); } }
    @keyframes safe-ready { 0%, 12%, 92%, 100% { opacity: 0; } 19%, 83% { opacity: .18; } }
    @keyframes first-trace { 0%, 20% { width: 0; } 31%, 100% { width: 70px; } }
    @keyframes first-connect { 0%, 19% { opacity: 0; } 20%, 83% { opacity: 1; } 92%, 100% { opacity: 0; } }
    @keyframes rule-read { 0%, 31%, 52%, 100% { transform: translateY(0); } 36%, 44% { transform: translateY(-6px); } }
    @keyframes rule-ready { 0%, 40%, 94%, 100% { opacity: 0; } 47%, 85% { opacity: .16; } }
    @keyframes second-trace { 0%, 49% { width: 0; } 60%, 100% { width: 70px; } }
    @keyframes second-connect { 0%, 48% { opacity: 0; } 49%, 85% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @keyframes question-arrive { 0%, 60%, 68%, 76%, 100% { transform: translateY(0); } 65% { transform: translateY(-7px); } 72% { transform: translateY(-3px); } }
    @keyframes action-arrive { 0%, 66%, 99%, 100% { opacity: .82; transform: translateY(6px); } 77%, 89% { opacity: 1; transform: translateY(0); } }
  </style>
  <rect width="1600" height="1040" rx="32" fill="#101828"/>
  <g fill="#F5F7FB">
    <text x="64" y="61" font-size="24" font-weight="600" fill="#98A9C1">판단과 행동의 흐름</text>
    <text x="1536" y="61" text-anchor="end" font-size="20" fill="#98A9C1">피싱 신호등 · 설명용 도식</text>
    <text x="64" y="137" font-size="56" font-weight="800" letter-spacing="-2">내 연락에서, 다음 행동까지.</text>
    <text x="64" y="184" font-size="25" fill="#B2CCFF">AI 판정 · 제한된 규칙 보정 · 사용자 확인</text>

    <rect x="64" y="238" width="432" height="632" rx="32" fill="#19283E"/>
    <g transform="translate(108 282)"><g class="model-icon"><use href="#chip"/></g></g>
    <text x="220" y="330" font-size="21" font-weight="600" fill="#B2CCFF">01 / 브라우저 AI</text>
    <text x="108" y="420" font-size="32" font-weight="700" letter-spacing="-1">연락의 문맥을 읽습니다</text>
    <text x="108" y="470" font-size="23" fill="#BDCADD">KLUE RoBERTa · C3 v2</text>
    <path d="M108 514h344" stroke="#344762"/>
    <circle cx="114" cy="556" r="6" fill="#98A9C1"/>
    <text x="136" y="564" font-size="24" font-weight="600">Dangerous · Hold</text>
    <text x="136" y="604" font-size="23" fill="#BDCADD">기본 판정 유지</text>
    <rect x="108" y="672" width="344" height="68" rx="18" fill="#22374F"/>
    <rect class="safe-focus" x="108" y="672" width="344" height="68" rx="18" fill="#84ADFF" aria-hidden="true"/>
    <text x="132" y="716" font-size="27" font-weight="700" fill="#B2CCFF">Safe → 규칙 확인</text>
    <text x="108" y="799" font-size="19" fill="#98A9C1">원문은 외부 AI 서버로</text>
    <text x="108" y="828" font-size="19" fill="#98A9C1">보내지 않습니다.</text>

    <text x="540" y="668" text-anchor="middle" font-size="18" fill="#B2CCFF">Safe</text>
    <path d="M512 710h56m-12-12 12 12-12 12" fill="none" stroke="#435D7D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="first-arrow" d="M512 710h56m-12-12 12 12-12 12" fill="none" stroke="#84ADFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#first-route)" aria-hidden="true"/>

    <rect x="584" y="238" width="432" height="632" rx="32" fill="#19283E"/>
    <g transform="translate(623 281) scale(1.3)"><g class="rule-icon"><use href="#browser"/></g></g>
    <text x="740" y="330" font-size="21" font-weight="600" fill="#B2CCFF">02 / 규칙 확인</text>
    <text x="628" y="420" font-size="32" font-weight="700" letter-spacing="-1">Safe만 다시 살핍니다</text>
    <text x="628" y="470" font-size="23" fill="#BDCADD">명확한 위험 행동 요구를</text>
    <text x="628" y="508" font-size="23" fill="#BDCADD">원문 구절과 함께 확인합니다.</text>
    <text x="628" y="576" font-size="19" fill="#98A9C1">근거 있음</text>
    <text x="628" y="620" font-size="29" font-weight="700" fill="#FEC84B">Hold로 보정</text>
    <rect class="rule-focus" x="608" y="663" width="384" height="107" rx="18" fill="#84ADFF" aria-hidden="true"/>
    <text x="628" y="700" font-size="19" fill="#98A9C1">근거 없음</text>
    <text x="628" y="744" font-size="29" font-weight="700" fill="#B2CCFF">행동 확인으로</text>

    <text x="1060" y="658" text-anchor="middle" font-size="17" fill="#B2CCFF">피해 상황</text>
    <text x="1060" y="684" text-anchor="middle" font-size="17" fill="#B2CCFF">미선택 시</text>
    <path d="M1032 730h56m-12-12 12 12-12 12" fill="none" stroke="#435D7D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="second-arrow" d="M1032 730h56m-12-12 12 12-12 12" fill="none" stroke="#84ADFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#second-route)" aria-hidden="true"/>

    <rect x="1104" y="238" width="432" height="632" rx="32" fill="#19283E"/>
    <g transform="translate(1143 283) scale(1.3)"><g class="question-icon"><use href="#message"/></g></g>
    <text x="1256" y="330" font-size="21" font-weight="600" fill="#B2CCFF">03 / 사용자 확인</text>
    <text x="1148" y="420" font-size="32" font-weight="700" letter-spacing="-1">실제 요청을 묻습니다</text>
    <text x="1148" y="470" font-size="22" fill="#BDCADD">송금 · 정보 전달 · 앱/기기 접근</text>
    <g class="action-result">
      <rect x="1148" y="534" width="344" height="148" rx="18" fill="#FEC84B"/>
      <text x="1172" y="572" font-size="19" fill="#654A10">있음 · 모름 · 미응답</text>
      <text x="1172" y="619" font-size="26" font-weight="700" fill="#101828">행동을 보류하고</text>
      <text x="1172" y="657" font-size="26" font-weight="700" fill="#101828">공식 경로로 확인</text>
    </g>
    <rect x="1148" y="710" width="344" height="70" rx="18" fill="#2B3D57"/>
    <text x="1172" y="754" font-size="22" font-weight="600">없음 → 위험 신호 미확인</text>
    <text x="1148" y="827" font-size="18" fill="#98A9C1">응답은 모델 라벨을 바꾸지 않습니다.</text>

    <path d="M64 910h1472" stroke="#293B53"/>
    <text x="64" y="962" font-size="20" fill="#98A9C1">이미 송금·정보 전달·앱 설치를 했다면</text>
    <text x="64" y="1000" font-size="25" font-weight="600" fill="#BDCADD">분석을 기다리지 않고 긴급 대응으로.</text>
    <text x="1022" y="962" font-size="19" fill="#98A9C1">모델 로딩·분석 실패와 관계없이 이용</text>
    <text x="1022" y="1000" font-size="19" fill="#98A9C1">피해 상황을 선택하면 Safe 질문 생략</text>
  </g>
</svg>
