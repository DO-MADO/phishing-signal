<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">위험 신호가 없어도, 실제 요청은 한 번 더 확인합니다</title>
  <desc id="desc">배송 안내 시연의 설명용 도식입니다. 최종 Safe이고 피해 상황을 선택하지 않았을 때 돈 보내기, 정보 전달, 앱 또는 기기 접근을 요구받았는지 묻습니다. 모르겠어요를 선택하면 모델 라벨은 그대로 두고 행동 보류와 공식 경로 확인을 안내합니다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#24344D" flood-opacity=".09"/>
    </filter>
    <clipPath id="arrow-reveal" clipPathUnits="userSpaceOnUse">
      <rect class="path-window" x="842" y="507" width="96" height="44"/>
    </clipPath>
    <g id="message">
      <path d="M14 13h36a10 10 0 0 1 10 10v21a10 10 0 0 1-10 10H27l-12 7V54h-1A10 10 0 0 1 4 44V23a10 10 0 0 1 10-10Z" fill="#F79009"/>
      <path d="M14 9h36a10 10 0 0 1 10 10v21a10 10 0 0 1-10 10H27l-12 7V50h-1A10 10 0 0 1 4 40V19A10 10 0 0 1 14 9Z" fill="#FEC84B"/>
      <rect x="15" y="23" width="34" height="5" rx="2.5" fill="#FFF7DB"/>
      <rect x="15" y="34" width="23" height="5" rx="2.5" fill="#FFF7DB"/>
    </g>
    <g id="phone">
      <path d="m12 10 7-2a4 4 0 0 1 5 2l6 11a4 4 0 0 1-1 5l-5 4a38 38 0 0 0 12 12l4-5a4 4 0 0 1 5-1l11 6a4 4 0 0 1 2 5l-2 7a8 8 0 0 1-9 6C26 57 7 38 6 19a8 8 0 0 1 6-9Z" fill="#D92D20"/>
      <path d="m12 6 7-2a4 4 0 0 1 5 2l6 11a4 4 0 0 1-1 5l-5 4a38 38 0 0 0 12 12l4-5a4 4 0 0 1 5-1l11 6a4 4 0 0 1 2 5l-2 7a8 8 0 0 1-9 6C26 53 7 34 6 15a8 8 0 0 1 6-9Z" fill="#F97066"/>
    </g>
  </defs>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    .choice-pulse, .path-pulse { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .choice-pulse { animation: choose 4.8s ease-in-out infinite; }
      .path-window { animation: trace 4.8s ease-in-out infinite; }
      .path-pulse { animation: connect 4.8s ease-in-out infinite; }
      .result-status { animation: status-arrive 4.8s ease-in-out infinite; }
      .result-title { animation: title-arrive 4.8s ease-in-out infinite; }
      .result-copy { animation: copy-arrive 4.8s ease-in-out infinite; }
    }
    @keyframes choose { 0%, 6%, 40%, 100% { opacity: 0; } 16%, 27% { opacity: 1; } }
    @keyframes trace { 0%, 24% { width: 0; } 44%, 100% { width: 96px; } }
    @keyframes connect { 0%, 23% { opacity: 0; } 24%, 58% { opacity: 1; } 68%, 100% { opacity: 0; } }
    @keyframes status-arrive { 0%, 44%, 96%, 100% { opacity: .72; transform: translateY(8px); } 53%, 84% { opacity: 1; transform: translateY(0); } }
    @keyframes title-arrive { 0%, 50%, 98%, 100% { opacity: .72; transform: translateY(8px); } 61%, 86% { opacity: 1; transform: translateY(0); } }
    @keyframes copy-arrive { 0%, 58%, 100% { opacity: .72; transform: translateY(8px); } 69%, 88% { opacity: 1; transform: translateY(0); } }
  </style>
  <rect width="1600" height="900" rx="32" fill="#FFFFFF"/>
  <g fill="#101828">
    <text x="72" y="68" fill="#667085" font-size="24" font-weight="600">행동 확인</text>
    <text x="72" y="145" font-size="56" font-weight="800" letter-spacing="-2">위험 신호가 없어도,</text>
    <text x="72" y="214" font-size="56" font-weight="800" letter-spacing="-2" fill="#2E6FF2">실제 요청은 한 번 더.</text>
    <text x="1528" y="67" text-anchor="end" font-size="20" fill="#667085">설명용 예시 · 배송 안내</text>
    <text x="1528" y="104" text-anchor="end" font-size="22" fill="#667085">최종 Safe · 피해 상황 미선택</text>

    <rect x="72" y="284" width="740" height="470" rx="36" fill="#F3F6FB" filter="url(#shadow)"/>
    <circle cx="110" cy="320" r="6" fill="#B2BDCC"/>
    <circle cx="132" cy="320" r="6" fill="#B2BDCC"/>
    <text x="774" y="327" text-anchor="end" font-size="20" fill="#667085">내 브라우저</text>
    <g transform="translate(112 376) scale(1.8)"><use href="#message"/></g>
    <text x="260" y="411" font-size="36" font-weight="700" letter-spacing="-1">상대가 이런 행동을</text>
    <text x="260" y="459" font-size="36" font-weight="700" letter-spacing="-1">하라고 했나요?</text>
    <text x="112" y="545" font-size="25" fill="#526077">돈 보내기 · 정보 전달 · 앱/기기 접근</text>
    <rect x="112" y="598" width="156" height="66" rx="20" fill="#E6ECF5"/>
    <rect x="282" y="598" width="156" height="66" rx="20" fill="#E6ECF5"/>
    <rect x="452" y="598" width="320" height="66" rx="20" fill="#101828"/>
    <rect class="choice-pulse" x="452" y="598" width="320" height="66" rx="20" fill="#2E6FF2" aria-hidden="true"/>
    <text x="190" y="640" text-anchor="middle" font-size="25" fill="#526077">있어요</text>
    <text x="360" y="640" text-anchor="middle" font-size="25" fill="#526077">없어요</text>
    <text x="604" y="640" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">모르겠어요</text>
    <path d="m714 630 7 7 13-15" stroke="#B2CCFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="710" font-size="20" fill="#667085">실제로 받은 요청을 직접 확인합니다.</text>

    <path d="M846 529h85m-14-14 14 14-14 14" fill="none" stroke="#D1DBEB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="path-pulse" d="M846 529h85m-14-14 14 14-14 14" fill="none" stroke="#528BFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#arrow-reveal)" aria-hidden="true"/>

    <rect x="968" y="284" width="560" height="470" rx="36" fill="#101828" filter="url(#shadow)"/>
    <g class="result-status">
      <g transform="translate(1017 343) scale(.78)"><use href="#phone"/></g>
      <text x="1090" y="358" font-size="20" fill="#B2CCFF">다음 행동</text>
      <text x="1090" y="395" font-size="27" font-weight="700" fill="#FFFFFF">행동 보류</text>
    </g>
    <g class="result-title">
      <text x="1012" y="475" font-size="36" font-weight="700" letter-spacing="-1" fill="#FFFFFF">무엇을 요청하는지</text>
      <text x="1012" y="523" font-size="36" font-weight="700" letter-spacing="-1" fill="#FFFFFF">먼저 확인해 주세요.</text>
    </g>
    <path d="M1012 559h472" stroke="#30435F"/>
    <g class="result-copy">
      <text x="1012" y="612" font-size="25" fill="#D0D9E8">송금·정보 전달·앱 설치는 보류하고</text>
      <text x="1012" y="652" font-size="25" fill="#D0D9E8">알고 있던 공식 경로에서 확인합니다.</text>
    </g>
    <text x="72" y="837" font-size="25" font-weight="600">답변은 다음 행동을 안내합니다.</text>
    <text x="1528" y="837" text-anchor="end" font-size="23" fill="#667085">모델 라벨은 바꾸지 않습니다.</text>
  </g>
</svg>
