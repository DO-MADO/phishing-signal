<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="434" viewBox="0 0 1120 434" role="img" aria-labelledby="title desc">
  <title id="title">Safe 이후에도 실제 행동 요구를 확인합니다</title>
  <desc id="desc">배송 안내 시연의 동작을 정리한 설명용 도식입니다. 최종 Safe이고 피해 상황을 선택하지 않았을 때 돈 보내기, 정보 전달, 앱 또는 기기 접근을 요구받았는지 묻습니다. 모르겠어요를 선택하면 모델 라벨은 바뀌지 않고 행동 보류와 공식 경로 확인을 안내합니다.</desc>
  <rect width="1120" height="434" rx="14" fill="#f8fafc"/>
  <g font-family="'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif">
    <text x="32" y="51" font-size="30" font-weight="700" fill="#101828">Safe 이후에도 실제 요구를 확인합니다</text>
    <text x="32" y="85" font-size="21" fill="#596579">배송 안내 시연 · 최종 Safe · 피해 상황 미선택</text>

    <rect x="32" y="112" width="470" height="249" rx="14" fill="#ffffff" stroke="#e5e9ee"/>
    <text x="58" y="151" font-size="20" font-weight="600" fill="#596579">사용자에게 다시 묻기</text>
    <text x="58" y="194" font-size="29" font-weight="700" fill="#101828">상대가 이런 행동을</text>
    <text x="58" y="231" font-size="29" font-weight="700" fill="#101828">하라고 했나요?</text>
    <text x="58" y="267" font-size="21" fill="#596579">돈 보내기 · 정보 전달 · 앱/기기 접근</text>
    <rect x="58" y="291" width="100" height="44" rx="8" fill="#f1f3f6"/>
    <rect x="169" y="291" width="100" height="44" rx="8" fill="#f1f3f6"/>
    <rect x="280" y="291" width="196" height="44" rx="8" fill="#fff7d6"/>
    <text x="108" y="321" text-anchor="middle" font-size="23" fill="#596579">있어요</text>
    <text x="219" y="321" text-anchor="middle" font-size="23" fill="#596579">없어요</text>
    <text x="378" y="321" text-anchor="middle" font-size="23" font-weight="700" fill="#7a4d00">모르겠어요 ✓</text>

    <path d="M524 237H596M584 225L596 237L584 249" fill="none" stroke="#b36a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="618" y="112" width="470" height="249" rx="14" fill="#fff7d6"/>
    <text x="644" y="151" font-size="20" font-weight="600" fill="#7a4d00">선택 후 안내 · 행동 보류</text>
    <text x="644" y="194" font-size="29" font-weight="700" fill="#101828">무엇을 요청하는지</text>
    <text x="644" y="231" font-size="29" font-weight="700" fill="#101828">먼저 확인해 주세요</text>
    <text x="644" y="275" font-size="22" fill="#7a4d00">송금·정보 전달·앱 설치는 보류하고,</text>
    <text x="644" y="309" font-size="22" fill="#7a4d00">알고 있던 공식 경로에서 확인합니다.</text>

    <text x="560" y="405" text-anchor="middle" font-size="21" fill="#596579">응답은 모델 라벨을 바꾸지 않습니다. 다음 행동을 안내합니다.</text>
  </g>
</svg>
